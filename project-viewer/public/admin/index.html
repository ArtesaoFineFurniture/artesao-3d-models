<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Projects · Artesão</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
  <style>
    :root {
      --ink: #2b241f;
      --muted: #7a6e64;
      --line: #e4dcd2;
      --paper: #faf7f2;
      --stage: #f1ece5;
      --accent: #6b4429;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 300 16px/1.5 system-ui, sans-serif;
    }
    header, main { width: min(920px, calc(100% - 8vw)); margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 0;
    }
    .brand {
      margin: 0;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }
    .brand small {
      display: block;
      margin-top: -2px;
      font-family: system-ui, sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin: 8px 0 6px;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-size: clamp(36px, 5vw, 52px);
      font-weight: 500;
      line-height: 1.05;
    }
    .lede { margin: 0 0 22px; max-width: 62ch; color: #4a4038; }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 18px;
      margin: 0 0 18px;
    }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
    input[type="password"], input[type="text"], select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 4px;
      padding: 10px 12px;
      font: 400 15px/1.4 system-ui, sans-serif;
    }
    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .row { display: flex; gap: 10px; align-items: center; }
    .row > * { flex: 1; }
    .row button { flex: 0 0 auto; }
    button, .linkish {
      border: 1px solid var(--ink);
      background: #fff;
      color: var(--ink);
      border-radius: 2px;
      padding: 10px 14px;
      font: 500 11px/1 system-ui, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
    }
    button.primary { background: var(--ink); color: #faf7f2; }
    button:disabled { opacity: 0.45; cursor: default; }
    button.quiet { border-color: transparent; letter-spacing: 0.12em; color: var(--muted); }
    .drop {
      display: grid;
      place-items: center;
      min-height: 140px;
      border: 1px dashed #c9b8a6;
      border-radius: 6px;
      background: #fbf9f5;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      padding: 18px;
    }
    .drop strong { color: var(--ink); font-weight: 500; }
    .drop input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .drop.over { border-color: var(--accent); background: #fff; }
    .fields { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 12px; margin-top: 14px; }
    .stage {
      margin-top: 14px;
      background: radial-gradient(ellipse at 50% 40%, #fbf9f5 0%, var(--stage) 70%);
      border-radius: 4px;
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 420px; }
    #status, .note { color: #4a4038; min-height: 1.4em; }
    .warn { color: var(--accent); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { border-top: 1px solid var(--line); padding: 14px 0; }
    li:first-child { border-top: 0; padding-top: 0; }
    .meta { margin: 6px 0 10px; color: var(--muted); font-size: 13px; }
    .linkrow { display: flex; gap: 8px; }
    .linkrow input { font-size: 13px; }
    h2 {
      margin: 0 0 12px;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-size: 28px;
      font-weight: 500;
    }
    @media (max-width: 720px) {
      .fields { grid-template-columns: 1fr; }
      canvas { height: 300px; }
      .row, .linkrow { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <header>
    <p class="brand">Artesão<small>Fine Furniture</small></p>
    <button type="button" id="lock" class="quiet" hidden>Lock</button>
  </header>
  <main>
    <section id="gate" class="card">
      <h1>Projects</h1>
      <p class="lede">Drop in an FBX from a commission. You get a private link the client can open, including View in your room on a phone.</p>
      <form id="gate-form">
        <label for="password">Password</label>
        <div class="row">
          <input id="password" type="password" autocomplete="current-password" maxlength="256" required>
          <button class="primary" type="submit">Continue</button>
        </div>
      </form>
      <p id="gate-error" class="warn" role="alert"></p>
    </section>

    <section id="workspace" hidden>
      <div class="card">
        <h2>New project</h2>
        <label class="drop" id="drop">
          <input id="file" type="file" accept=".fbx,application/octet-stream">
          <span><strong>Drop an FBX here</strong><br>or choose a file. About 1–5 MB. Textures are not kept.</span>
        </label>
        <div class="stage" id="stage" hidden>
          <canvas id="preview"></canvas>
        </div>
        <div class="fields">
          <div>
            <label for="units">Units</label>
            <select id="units">
              <option value="auto">Auto</option>
              <option value="mm">Millimeters</option>
              <option value="cm">Centimeters</option>
              <option value="m">Meters</option>
              <option value="in">Inches</option>
              <option value="ft">Feet</option>
            </select>
          </div>
          <div>
            <label for="up">Orientation</label>
            <select id="up">
              <option value="file">As exported</option>
              <option value="z">Rotate onto the floor</option>
            </select>
          </div>
          <div>
            <label for="name">Project or client</label>
            <input id="name" type="text" maxlength="120" placeholder="Smith dining table">
          </div>
        </div>
        <p id="status" role="status"></p>
        <p id="warn" class="warn"></p>
        <div class="actions">
          <button type="button" class="primary" id="save" disabled>Create private link</button>
        </div>
      </div>

      <div class="card" id="result" hidden>
        <h2>Link</h2>
        <p class="note">Anyone with this link can open the model. It is not listed on the site.</p>
        <div class="linkrow">
          <input id="share" type="text" readonly>
          <button type="button" id="copy">Copy</button>
          <a id="open" class="linkish" href="" target="_blank" rel="noopener noreferrer">Open</a>
        </div>
      </div>

      <div class="card">
        <h2>Your projects</h2>
        <p id="empty" class="note" hidden>No projects yet.</p>
        <ul id="list"></ul>
      </div>
    </section>
  </main>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
