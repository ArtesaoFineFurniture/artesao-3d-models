<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Artesão</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #faf7f2;
      color: #2b241f;
      font: 300 16px/1.5 system-ui, sans-serif;
    }
    header, main { width: min(1100px, calc(100% - 8vw)); margin: 0 auto; }
    header { padding: 22px 0 8px; }
    .brand {
      margin: 0;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }
    .brand small {
      display: block;
      margin-top: -2px;
      font-family: system-ui, sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #7a6e64;
    }
    main { padding-bottom: 48px; }
    h1 {
      margin: 18px 0 4px;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 500;
      line-height: 1.05;
    }
    #size {
      margin: 0 0 16px;
      color: #7a6e64;
      font-size: 13px;
      letter-spacing: 0.04em;
    }
    #missing { margin-top: 18vh; color: #4a4038; }

    /* The stage below is the v3 Squarespace snippet, kept as a full page. */
    .artesao-3d, .artesao-3d * { box-sizing: border-box; }
    .artesao-3d {
      position: relative;
      background: radial-gradient(ellipse at 50% 40%, #fbf9f5 0%, #f1ece5 70%);
      border-radius: 4px;
      overflow: hidden;
    }
    .artesao-3d model-viewer {
      width: 100%;
      height: clamp(380px, 70vh, 640px);
      display: block;
      background: transparent;
      --poster-color: transparent;
      --progress-bar-color: #6b4429;
      --progress-bar-height: 2px;
    }
    .artesao-3d .artesao-ar {
      position: absolute;
      top: 16px;
      right: 16px;
      border: 1px solid #2b241f;
      background: rgba(250, 247, 242, 0.92);
      color: #2b241f;
      padding: 10px 16px;
      font: 500 11px/1 sans-serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
    }
    .artesao-3d .artesao-ar:hover,
    .artesao-3d .artesao-ar:focus-visible {
      background: #2b241f;
      color: #faf7f2;
      outline: none;
    }
    .artesao-3d .artesao-hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14px;
      text-align: center;
      pointer-events: none;
      font: 400 11px/1.4 sans-serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #7a6e64;
    }
  </style>
</head>
<body>
  <header>
    <p class="brand">Artesão<small>Fine Furniture</small></p>
  </header>
  <main>
    <p id="missing" hidden>This page is not available.</p>
    <h1 id="name" hidden></h1>
    <p id="size" hidden></p>
    <div class="artesao-3d" id="stage" hidden>
      <model-viewer
        id="viewer"
        alt="3D model"
        camera-controls
        touch-action="pan-y"
        auto-rotate
        auto-rotate-delay="1500"
        rotation-per-second="18deg"
        interaction-prompt="auto"
        camera-orbit="35deg 78deg auto"
        min-camera-orbit="auto 15deg auto"
        max-camera-orbit="auto 95deg auto"
        field-of-view="30deg"
        environment-image="neutral"
        exposure="1.05"
        shadow-intensity="1"
        shadow-softness="0.85"
        tone-mapping="neutral"
        ar
        ar-modes="scene-viewer webxr quick-look"
        ar-scale="fixed"
        ar-placement="floor"
        loading="lazy"
        reveal="auto">
        <button slot="ar-button" type="button" class="artesao-ar">View in your room</button>
      </model-viewer>
      <div class="artesao-hint">Drag to rotate · Pinch or scroll to zoom</div>
    </div>
  </main>
  <script type="module" src="/js/view.js"></script>
</body>
</html>
