# Private project viewer. In the Netlify UI, set the site's base directory
# to project-viewer and set the ADMIN_PASSWORD environment variable.
# Do not put the password in this file.

[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Omit devDependencies (the browser test's Chrome driver) from the deploy install.
  NODE_ENV = "production"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

# One static page for every private link. The token is the rest of the path.
[[redirects]]
  from = "/view/*"
  to = "/view/index.html"
  status = 200

# There is no catalog. The root is the same not-found page as an unknown address.
[[redirects]]
  from = "/"
  to = "/404.html"
  status = 404
  force = true
